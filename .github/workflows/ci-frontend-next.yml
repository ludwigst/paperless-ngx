name: Next.js Frontend
on:
  push:
    paths:
      - 'frontend-next/**'
      - '.github/workflows/ci-frontend-next.yml'
  pull_request:
    paths:
      - 'frontend-next/**'
      - '.github/workflows/ci-frontend-next.yml'
  workflow_dispatch:
concurrency:
  group: frontend-next-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend-next/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
